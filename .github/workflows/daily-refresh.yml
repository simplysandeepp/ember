name: Daily content refresh

# Refreshes certification brand logos and compresses any new project
# screenshots that landed as .png. Runs every day at 05:00 UTC
# (10:30 AM IST) and can also be triggered manually from the Actions tab.
#
# If either script produces file changes, they're committed straight to
# main with the github-actions bot identity. If nothing changed, the job
# exits cleanly with no commit.

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          # Fetch full history so the auto-commit can push cleanly.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install sharp
        # Only sharp is needed — both scripts are plain .mjs files with
        # no other runtime deps. Skipping the full `npm ci` keeps the
        # job under a minute.
        run: npm install --no-save sharp

      - name: Refresh certification logos
        run: node scripts/localize-cert-logos.mjs

      - name: Compress new project screenshots
        run: node scripts/compress-project-images.mjs

      - name: Commit and push if there are changes
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "Nothing changed — no commit needed."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "chore(daily): refresh cert logos and compress new project images

          Auto-generated by .github/workflows/daily-refresh.yml"

          # Retry once against a fresh main to avoid the race where a
          # human pushes between checkout and push.
          git pull --rebase origin main
          git push origin HEAD:main
