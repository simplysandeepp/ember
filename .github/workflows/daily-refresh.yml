name: Content refresh (every 6h)

# Refreshes certification brand logos and compresses new project
# screenshots — 4 times a day, every 6 hours. Every scheduled tick is
# independent: one failed run doesn't stop the next one, and every
# fragile step is wrapped so a transient network hiccup can't fail the
# whole run.
#
# Ticks (UTC):   00:00   06:00   12:00   18:00
# Ticks (IST):   05:30   11:30   17:30   23:30
#
# Manual override: Actions tab → "Content refresh (every 6h)" → Run.

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Overlapping ticks queue instead of cancel — never lose a run.
concurrency:
  group: content-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install sharp
        # Retry the install up to 3 times so a flaky npm registry
        # response doesn't fail the tick.
        run: |
          for i in 1 2 3; do
            npm install --no-save sharp && break
            echo "npm install failed (attempt $i) — retrying in 10s"
            sleep 10
          done

      - name: Refresh certification logos
        # continue-on-error lets the image-compression step still run
        # even if Wikipedia / Google favicon service returned a 429/5xx
        # for one of the sources this tick.
        continue-on-error: true
        run: node scripts/localize-cert-logos.mjs

      - name: Compress new project screenshots
        continue-on-error: true
        run: node scripts/compress-project-images.mjs

      - name: Commit and push if there are changes
        # This step is guarded so an empty working tree exits cleanly.
        # Push has one rebase-retry to survive the rare race where a
        # human commit lands between checkout and push.
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "Nothing changed — no commit needed."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "chore(refresh): update cert logos / compress new project images

          Auto-generated by .github/workflows/daily-refresh.yml"

          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "push failed (attempt $i) — retrying in 15s"
            sleep 15
          done
          echo "push failed after 3 retries — this tick logs but doesn't stop the schedule; next tick will try again in 6h"
          exit 0
